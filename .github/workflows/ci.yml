name: CI

on:
  push:
    branches: [master, "release/**", "feat/phux-vt-1"]
  pull_request:
    # `edited` covers a retargeted base, which happens to every stacked PR
    # once the one below it merges.
    types: [opened, synchronize, reopened, edited]
    branches: [master, "release/**", "stack/ghostty-*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64
            runner: macos-15
            flake_check: true
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            flake_check: true
          - name: Linux x86_64
            runner: ubuntu-24.04
            flake_check: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Use Ghostty binary cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ghostty
          skipPush: true

      - name: Build package derivation
        run: nix build .#default --print-build-logs

      - name: Run flake checks
        if: matrix.flake_check
        run: nix flake check --print-build-logs

      # Exercises the vendored iOS xcframework build path, which needs a
      # macOS host with the real Xcode toolchain (the dev shell strips the
      # Nix SDK wrappers so zig detects the system SDKs).
      - name: Check iOS vendored build
        if: runner.os == 'macOS'
        run: nix develop -c cargo check --locked -p libghostty-vt-sys --target aarch64-apple-ios

      # The examples are their own workspace, so the flake checks above never
      # build them. `--locked` also fails if example/Cargo.lock is stale.
      # Use the shell's native Ghostty library instead of compiling it again.
      # Wasm and iOS below deliberately keep exercising source builds.
      - name: Build examples
        run: |
          nix develop -c cargo build --locked --manifest-path example/Cargo.toml --workspace --features libghostty-vt/pkg-config
          nix develop -c cargo test --locked --manifest-path example/Cargo.toml -p wasm_rs --features libghostty-vt/pkg-config

      # Link and execute Rust + Zig together. cargo check cannot catch ABI,
      # callback table, allocator, or unexpected host-import failures.
      - name: Test wasm32
        if: matrix.name == 'Linux x86_64'
        run: |
          nix develop -c bash -euc '
            for profile in dev release; do
              cargo build --locked --manifest-path example/Cargo.toml -p wasm_rs --lib --example smoke --target wasm32-unknown-unknown --profile "$profile"
              out="example/target/wasm32-unknown-unknown/${profile/dev/debug}"
              node example/wasm_rs/run.mjs "$out/examples/smoke.wasm" "$out/wasm_rs.wasm"
            done
          '

      - name: Test wasm64
        if: matrix.name == 'Linux x86_64'
        run: |
          nix develop .#wasm64 -c bash -euc '
            for profile in dev release; do
              cargo build -Zbuild-std=std,panic_abort --locked --manifest-path example/Cargo.toml -p wasm_rs --lib --example smoke --target wasm64-unknown-unknown --profile "$profile"
              out="example/target/wasm64-unknown-unknown/${profile/dev/debug}"
              node example/wasm_rs/run.mjs "$out/examples/smoke.wasm" "$out/wasm_rs.wasm"
            done
          '

  miri:
    name: Linux Miri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Miri soundness checks
        run: nix run .#miri
