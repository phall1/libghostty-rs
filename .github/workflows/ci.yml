name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }} ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64
            runner: macos-latest
            profile: debug
          - name: macOS aarch64
            runner: macos-latest
            profile: release
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            profile: debug
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            profile: release
          - name: Linux x86_64
            runner: ubuntu-latest
            profile: debug
          - name: Linux x86_64
            runner: ubuntu-latest
            profile: release
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Set cargo profile flag
        id: profile
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            echo "flag=--release" >> "$GITHUB_OUTPUT"
            echo "dir=release" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "dir=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Test libghostty-vt-sys
        run: nix develop -c cargo test -p libghostty-vt-sys ${{ steps.profile.outputs.flag }}

      - name: Build ghostling_rs with dynamic linking
        run: nix develop -c cargo build -p ghostling_rs ${{ steps.profile.outputs.flag }}

      - name: Build ghostling_rs with static linking
        if: runner.os != 'Linux'
        run: nix develop -c cargo build -p ghostling_rs --features link-static ${{ steps.profile.outputs.flag }}

      - name: Build ghostling_rs with static linking via zig cc
        if: runner.os == 'Linux'
        run: nix develop -c ./scripts/cargo-zig-linker build -p ghostling_rs --features link-static ${{ steps.profile.outputs.flag }}

      - name: Verify Linux static build avoids libc++ runtime deps
        if: runner.os == 'Linux'
        run: |
          nix develop -c sh -c '
            readelf -d target/${{ steps.profile.outputs.dir }}/ghostling_rs | grep NEEDED
            ! readelf -d target/${{ steps.profile.outputs.dir }}/ghostling_rs | grep -Eq "libc\+\+|libc\+\+abi"
          '

      - name: Verify macOS static build does not link libghostty-vt dylib
        if: runner.os == 'macOS'
        run: |
          deps=$(otool -L target/${{ steps.profile.outputs.dir }}/ghostling_rs)
          echo "$deps"
          if echo "$deps" | grep -q "libghostty-vt"; then
            echo "ERROR: static binary still references libghostty-vt dylib" >&2
            exit 1
          fi
